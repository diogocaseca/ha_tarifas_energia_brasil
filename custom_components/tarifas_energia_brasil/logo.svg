<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Torre de transmissao</title>
  <desc id="desc">Uma torre de transmissao eletrica preta em fundo branco</desc>

  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pernas externas -->
    <path d="M256 62 L150 430" stroke-width="13"/>
    <path d="M256 62 L362 430" stroke-width="13"/>

    <!-- Montantes internos -->
    <path d="M226 108 L188 430" stroke-width="7"/>
    <path d="M286 108 L324 430" stroke-width="7"/>
    <path d="M256 62 L256 430" stroke-width="7"/>

    <!-- Travessas (geometria de torre real) -->
    <line x1="210" y1="108" x2="302" y2="108" stroke-width="10"/>
    <line x1="144" y1="132" x2="368" y2="132" stroke-width="12"/>
    <line x1="160" y1="196" x2="352" y2="196" stroke-width="11"/>
    <line x1="176" y1="260" x2="336" y2="260" stroke-width="9"/>
    <line x1="188" y1="322" x2="324" y2="322" stroke-width="8"/>
    <line x1="196" y1="378" x2="316" y2="378" stroke-width="8"/>

    <!-- Trelica em X -->
    <line x1="210" y1="108" x2="150" y2="196" stroke-width="6"/>
    <line x1="302" y1="108" x2="362" y2="196" stroke-width="6"/>
    <line x1="150" y1="196" x2="214" y2="260" stroke-width="6"/>
    <line x1="362" y1="196" x2="298" y2="260" stroke-width="6"/>
    <line x1="214" y1="260" x2="188" y2="322" stroke-width="6"/>
    <line x1="298" y1="260" x2="324" y2="322" stroke-width="6"/>
    <line x1="188" y1="322" x2="196" y2="378" stroke-width="6"/>
    <line x1="324" y1="322" x2="316" y2="378" stroke-width="6"/>

    <line x1="210" y1="108" x2="302" y2="196" stroke-width="5"/>
    <line x1="302" y1="108" x2="210" y2="196" stroke-width="5"/>
    <line x1="214" y1="196" x2="298" y2="260" stroke-width="5"/>
    <line x1="298" y1="196" x2="214" y2="260" stroke-width="5"/>
    <line x1="214" y1="260" x2="298" y2="322" stroke-width="5"/>
    <line x1="298" y1="260" x2="214" y2="322" stroke-width="5"/>

    <!-- Base e solo -->
    <line x1="136" y1="430" x2="376" y2="430" stroke-width="14"/>
    <line x1="28" y1="448" x2="484" y2="448" stroke-width="5"/>
  </g>

  <!-- Isoladores -->
  <g fill="#000000">
    <circle cx="166" cy="132" r="5"/>
    <circle cx="346" cy="132" r="5"/>
    <circle cx="178" cy="196" r="4.5"/>
    <circle cx="334" cy="196" r="4.5"/>
  </g>
</svg>
